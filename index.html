<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>
    <div class="calbody">
        <div class="display">
            <div class="calculated"></div>
            <div class="calculation"></div>
        </div>
        <div class="keypad">
            <buton class="btn btn-action" data-action="clear">AC</buton>
            <buton class="btn btn-action" data-action="delete">DEL</buton>
            <buton class="btn btn-action" data-action="percent">%</buton>
            <buton class="btn btn-operator" data-operator="&divide;">&divide;</buton>

            <buton class="btn btn-number" data-number="7">7</buton>
            <buton class="btn btn-number" data-number="8">8</buton>
            <buton class="btn btn-number" data-number="9">9</buton>
            <buton class="btn btn-operator" data-operator="x">x</buton>

            <buton class="btn btn-number" data-number="4">4</buton>
            <buton class="btn btn-number" data-number="5">5</buton>
            <buton class="btn btn-number" data-number="6">6</buton>
            <buton class="btn btn-operator" data-operator="-">-</buton>

            <buton class="btn btn-number" data-number="1">1</buton>
            <buton class="btn btn-number" data-number="2">2</buton>
            <buton class="btn btn-number" data-number="3">3</buton>
            <buton class="btn btn-operator" data-operator="+">+</buton>

            <button class="btn btn-action" data-toggle="toggle">+/-</button>
            <button class="btn btn-number" data-number="0">0</button>
            <button class="btn btn-number" data-number=".">.</button>
            <button class="btn btn-equals" data-action="calculate">=</button>

        </div>
    </div>
    <script src="script.js"></script>

</body>

</html>
